name: Test
on: [ push, pull_request ]
jobs:
  unit:
    name: "Unit tests (TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TYPO3 12.4 is not covered here: every public v12 release is affected by open
        # security advisories (the fixes are ELTS only), so Composer refuses to install it.
        include:
          - { typo3: '13.4', php: '8.2' }
          - { typo3: '13.4', php: '8.3' }
          - { typo3: '13.4', php: '8.4' }
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer update --no-progress --prefer-dist --optimize-autoloader --with="typo3/cms-core:^${{ matrix.typo3 }}"

      - name: Composer code-check
        run: composer code-check

      - name: Composer code-test
        run: composer code-test
